name: Small Caps Momentum

on:
  schedule:
    - cron: "7 0 * * 2-6"
    - cron: "7 1 * * 2-6"
    - cron: "33 10 * * 1-5"
    - cron: "33 11 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test, night_now or morning_now"
        default: "test"

permissions:
  contents: write

jobs:
  smallcaps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run small caps scanner
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python smallcaps.py ${{ github.event.inputs.mode }}
      - name: Save small caps list
        if: always()
        run: |
          if [ -f small_universe.txt ] && [ -n "$(git status --porcelain small_universe.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add small_universe.txt
            git commit -m "Update small caps list"
            git push
          fi
